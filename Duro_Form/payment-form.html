</div>


<div class="mb-3">
<label class="form-label">Employee ID</label>

<div class="mb-3">

<option value="">Select</option>

</div>

</div>

<div class="mb-3">

</form>

<!-- PAYMENT TABLE -->
<div class="col-lg-9">

<div class="table-responsive">

<thead class="table-dark">
<tr>
<th>ID</th>
<th>Order</th>
<th>Customer</th>
<th>Method</th>
<th>Total</th>
<th>Down</th>
<th>Balance</th>
<th>Date</th>
<th>Status</th>

<!-- Footer -->

<!-- your existing footer HTML -->

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>

document.addEventListener("DOMContentLoaded", () => {

    const paymentForm = document.getElementById("paymentForm");
    const tableBody = document.getElementById("paymentTableBody");

    function loadPayments(){
        fetch("payment_crud.php?action=read")
        .then(res => res.text())
        .then(html => tableBody.innerHTML = html);
    }
    loadPayments();

    // Handle form submit via AJAX
    paymentForm.addEventListener("submit", e => {
        e.preventDefault();
        const formData = new FormData(paymentForm);

        fetch("payment_crud.php?action=create", {
            method: "POST",
            body: formData
        })
        .then(res => res.text())
        .then(msg => {
            alert(msg.replace(/(<([^>]+)>)/gi, "")); // remove HTML tags
            paymentForm.reset();
            loadPayments(); // reload table
        })
        .catch(err => console.error(err));
    });

    // Delegate delete button clicks
    tableBody.addEventListener("click", e => {
        if(e.target.matches(".btn-danger")){
            e.preventDefault();
            if(!confirm("Delete this payment?")) return;

            fetch(e.target.href)
            .then(res => res.text())
            .then(msg => {
                alert(msg.replace(/(<([^>]+)>)/gi, ""));
                loadPayments();
            })
            .catch(err => console.error(err));
        }
    });
});
</script>



<script src="payment.js"></script>
