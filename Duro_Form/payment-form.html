<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KD Sportswear & Apparel - Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="payment.css">
<link rel="stylesheet" href="../css/styles.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar" id="navbar">
    <div class="container">
        <a href="../home.html#home" class="navbar-brand">KD Sportswear & Apparel</a>
        <ul class="navbar-menu">
            <li><a href="../Magan_Form/employee_to_inquiry_order.php">Inquiry List</a></li>
            <li><a href="../Valle_Form/orders.php">Order List</a></li>
            <li><a href="#" class="active">Payment</a></li>
        </ul>
    </div>
</nav>

<!-- HEADER -->
<div class="header">
    <h1>KD SPORTSWEAR & APPAREL</h1>
    <p class="sub">Payment Management</p>
</div>

<div class="container-main">
<div class="row">

<!-- PAYMENT FORM -->
<div class="col-lg-3">
<div class="form-container">
<h2>Payment Details</h2>

<form method="POST" action="payment_crud.php?action=create" class="needs-validation" novalidate>

<input type="hidden" name="payment_id">

<div class="mb-3">
<label class="form-label">Order ID</label>
<input type="number" class="form-control" name="order_id" required>
</div>

<div class="mb-3">
<label class="form-label">Customer ID</label>
<input type="number" class="form-control" name="customer_id" required>
</div>

<div class="mb-3">
<label class="form-label">Employee ID</label>
<input type="number" class="form-control" name="employee_id">
</div>

<div class="mb-3">
<label class="form-label">Method of Payment</label>
<select class="form-select" name="method_of_payment" required>
<option value="">Select</option>
<option value="CASH">Cash</option>
<option value="GCASH">GCash</option>
<option value="BANK_TRANSFER">Bank Transfer</option>
</select>
</div>

<div class="mb-3">
<label class="form-label">Total Amount</label>
<input type="number" class="form-control" name="total_amount" required min="1">
</div>

<div class="mb-3">
<label class="form-label">Downpayment</label>
<input type="number" class="form-control" name="downpayment" value="0">
</div>

<div class="mb-3">
<label class="form-label">Balance</label>
<input type="number" class="form-control" name="balance" required min="0">
</div>

<div class="mb-3">
<label class="form-label">Payment Date</label>
<input type="date" class="form-control" name="date" required>
</div>

<div class="mb-3">
<label class="form-label">Status</label>
<select class="form-select" name="status">
<option value="PENDING">Pending</option>
<option value="COMPLETED">Completed</option>
<option value="FAILED">Failed</option>
</select>
</div>

<button class="btn btn-primary w-100">CONFIRM PAYMENT</button>

</form>
</div>
</div>

<!-- PAYMENT TABLE -->
<div class="col-lg-9">
<div class="table-container">
<h2>Payment Records</h2>

<div class="table-responsive">
<table class="table table-striped">
<thead class="table-dark">
<tr>
<th>ID</th>
<th>Order</th>
<th>Customer</th>
<th>Method</th>
<th>Total</th>
<th>Down</th>
<th>Balance</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="paymentTableBody">
<!-- loaded via PHP -->
</tbody>
</table>
</div>
</div>
</div>

</div>
</div>

<!-- LOAD DATA -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    fetch("payment_crud.php?action=read")
        .then(res => res.text())
        .then(html => {
            document.getElementById("paymentTableBody").innerHTML = html;
        });
});
</script>

</body>
</html>
